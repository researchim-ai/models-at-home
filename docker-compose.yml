# Models at Home Studio — Electron Backend
#
# First: docker build -t models-at-home-base:latest ${MAH_RUNTIME_ROOT:-../models-at-home}
# Then: docker compose up --build
#
# The Electron app manages this automatically, but you can run it standalone.

services:
  backend:
    image: models-at-home-studio:latest
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: mah-studio-backend
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:8888:8888"
    volumes:
      - ${MAH_RUNTIME_ROOT:-../models-at-home}/datasets:/app/datasets
      - ${MAH_RUNTIME_ROOT:-../models-at-home}/out:/app/out
      - ${MAH_RUNTIME_ROOT:-../models-at-home}/.runs:/app/.runs
      - ${MAH_RUNTIME_ROOT:-../models-at-home}/blueprints:/app/blueprints
      - ${MAH_RUNTIME_ROOT:-../models-at-home}/models:/app/models
      - ${MAH_RUNTIME_ROOT:-../models-at-home}/configs:/app/configs
      - ./backend:/app/backend:ro
      - ${MAH_RUNTIME_ROOT:-../models-at-home}/notebooks:/app/notebooks
      - ${MAH_RUNTIME_ROOT:-../models-at-home}/study_materials:/app/study_materials:ro
    environment:
      - PYTHONUNBUFFERED=1
      - MODELS_AT_HOME_ROOT=/app
      - HF_TOKEN=${HF_TOKEN:-}
      - MAH_WORLD_PYTHON=${MAH_DOCKER_WORLD_PYTHON:-}
      - JUPYTER_BIND_HOST=0.0.0.0
      - MKL_THREADING_LAYER=GNU
      - HOME=/tmp
      - XDG_CACHE_HOME=/tmp/.cache
      - HF_HOME=/tmp/.cache/huggingface
      - HF_DATASETS_CACHE=/tmp/.cache/huggingface/datasets
      - HUGGINGFACE_HUB_CACHE=/tmp/.cache/huggingface/hub
      - TRITON_CACHE_DIR=/tmp/.cache/triton
      - TORCH_HOME=/tmp/.cache/torch
      - TORCHINDUCTOR_CACHE_DIR=/tmp/.cache/torchinductor
      - CUDA_CACHE_PATH=/tmp/.cache/nv
      - NUMBA_CACHE_DIR=/tmp/.cache/numba
      - MPLCONFIGDIR=/tmp/.cache/matplotlib
      - PIP_CACHE_DIR=/tmp/.cache/pip
      - NVIDIA_DRIVER_CAPABILITIES=all
      - MAH_AGENT_AUTOLOAD=${MAH_AGENT_AUTOLOAD:-1}
      - MAH_AGENT_CPU_ONLY=${MAH_AGENT_CPU_ONLY:-0}
      - MAH_AGENT_CTX_SIZE=${MAH_AGENT_CTX_SIZE:-262144}
      - MAH_AGENT_GPU_LAYERS=${MAH_AGENT_GPU_LAYERS:--1}
      - MAH_AGENT_MODEL=${MAH_AGENT_MODEL:-}
      - MAH_AGENT_MODEL_REPO=${MAH_AGENT_MODEL_REPO:-unsloth/Qwen3.5-9B-GGUF}
      - MAH_AGENT_MODEL_QUANT=${MAH_AGENT_MODEL_QUANT:-9B-UD-Q4_K_XL}
      - MAH_AGENT_MODEL_FILENAME=${MAH_AGENT_MODEL_FILENAME:-}
      - NCCL_DEBUG=WARN
    shm_size: "8gb"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: ["python", "-m", "uvicorn", "backend.api:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped

  notebooks:
    image: models-at-home-studio:latest
    container_name: mah-studio-notebooks
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "127.0.0.1:8889:8888"
    volumes:
      - ${MAH_RUNTIME_ROOT:-../models-at-home}/datasets:/app/datasets
      - ${MAH_RUNTIME_ROOT:-../models-at-home}/out:/app/out
      - ${MAH_RUNTIME_ROOT:-../models-at-home}/.runs:/app/.runs
      - ${MAH_RUNTIME_ROOT:-../models-at-home}/models:/app/models
      - ${MAH_RUNTIME_ROOT:-../models-at-home}/configs:/app/configs
      - ${MAH_RUNTIME_ROOT:-../models-at-home}/notebooks:/app/notebooks
    environment:
      - PYTHONUNBUFFERED=1
      - MODELS_AT_HOME_ROOT=/app
      - JUPYTER_BIND_HOST=0.0.0.0
      - MKL_THREADING_LAYER=GNU
      - HOME=/tmp
      - XDG_CACHE_HOME=/tmp/.cache
      - HF_HOME=/tmp/.cache/huggingface
      - NVIDIA_DRIVER_CAPABILITIES=all
    shm_size: "8gb"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: ["jupyter", "lab", "--ip=0.0.0.0", "--port=8888", "--no-browser", "--ServerApp.root_dir=/app/notebooks"]
    restart: unless-stopped
    profiles:
      - notebooks
